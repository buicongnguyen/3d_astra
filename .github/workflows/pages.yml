name: Test and deploy Frontier Command

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: github-io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-io/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:defence
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontier-${{ github.sha }}
          path: github-io/dist/
          retention-days: 1

  browser:
    name: Browser checks (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include:
          - name: desktop
            scripts: browser
          - name: training
            scripts: tutorial
          - name: mobile
            scripts: mobile mobile-controls mobile-gestures fullscreen
          - name: settings
            scripts: improvements campaign offline
          - name: story
            scripts: missions tactics-ui
          # Split from "story": the four suites together ran 27 to 30 minutes on the runner (the cap).
          - name: story-audio
            scripts: audio choices
          - name: scenes
            scripts: story
          - name: music
            scripts: music
          - name: languages
            scripts: language
          - name: interface
            scripts: ui-quality ambient-life
          # Split from "interface" (Wave 1 integration): render-budget is its own group; the pair ran ~94 s locally, ~22 min estimated on the runner.
          - name: interface-budget
            scripts: render-budget
          - name: progression
            scripts: progression
          - name: maps
            scripts: stages corners new-game boundary-fx
          - name: commands
            scripts: auto-combat harvesters hotkeys pc-controls selection
          - name: construction
            scripts: mobile-construction patrol repair-rally
          - name: feedback
            scripts: activity
          - name: status-layout
            scripts: status-layout
          - name: layout-desktop
            scripts: layout-f
            layoutOnly: desktop,hd,laptop,tablet
          - name: layout-mobile
            scripts: layout-f
            layoutOnly: portrait,landscape,landscape-vi,portrait-vi
          - name: ui-extras
            scripts: ui-extras abilities
          # Split from "ui-extras" (Wave 1 integration): the three suites ran ~119 s locally, ~28 min estimated on the runner.
          - name: ui-extras-messages
            scripts: messages
          - name: visuals
            scripts: visual-combat feel model-loading portraits
          # Split from "visuals" (Wave 2 integration): all six suites ran ~82 s locally, ~19 min estimated on the runner (limit 20).
          - name: visuals-world
            scripts: factions terrain
          - name: defence
            scripts: defence defence-zones
          - name: air
            scripts: air
          - name: chronicles
            scripts: chronicles
          - name: bosses
            scripts: boss
          # AAA round 2 (W0-A): every golden pin with GOLDEN_FULL=1 (300 s points, save and reload,
          # Three Roads, Endless to wave 12), off the 10-minute build job. It needs no browser.
          - name: golden-full
            scripts: golden-full
          # AAA round 2 (W1-B): the Gunner team on the phone (tall enough, the pin icon draws).
          - name: r2-w1b
            scripts: gunner
          - name: r2-w1e
            scripts: sovereign
          # AAA round 2 (W1-A): the Expanded roster setting and the Field workshop.
          - name: r2-w1a
            scripts: workshops
          # AAA round 2 (W1-F): the Defence command deck (fast-forward through the frame loop, tower aim, chips, card).
          - name: r2-w1f
            scripts: defence-deck
          # AAA round 2 (W1-D): phones first-class, the battlefield share on a phone.
          - name: r2-w1d
            scripts: phones
          # AAA round 2 (W2-B): Heroic challenges (tab, teaser, badge) and the Heroic bot check, off the build job.
          - name: r2-w2b
            scripts: defence-heroic defence-heroic-check
          # AAA round 2 (W2-C): the title screen (wordmark, display font, taps, text sizes).
          - name: r2-w2c
            scripts: title
          # AAA round 2 (W2-F): title cards, boss presence, the Keystone Roads node.
          - name: r2-w2f
            scripts: showtime
          # AAA round 3 (R3-C): the Army size row (200 desktop-only) and the Combined armour step.
          - name: r3-c
            scripts: army-depth
    defaults:
      run:
        working-directory: github-io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-io/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontier-${{ github.sha }}
          path: github-io/dist/
      - name: Install browser for smoke tests
        # The Ubuntu package mirror is sometimes unreachable from the runners for hours. Its packages here
        # are extra fonts; the runner image already carries the libraries Chrome needs. So: give the full
        # install four minutes, then install the browser alone (that download does not use the mirror).
        run: |
          if timeout 240 npx playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::System packages unavailable; installing the browser without them."
          npx playwright install chromium
      - name: Test the built game
        env:
          TEST_SCRIPTS: ${{ matrix.scripts }}
          LAYOUT_ONLY: ${{ matrix.layoutOnly }}
          TEST_URL: http://127.0.0.1:4173/
        run: |
          npm run preview -- --port 4173 > /tmp/frontier-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$TEST_URL" > /dev/null
          echo "### Browser suites (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| suite | result | time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for script in $TEST_SCRIPTS; do
            started=$(date +%s)
            if npm run "test:$script"; then result=pass; else result=FAIL; status=1; fi
            echo "| $script | $result | $(( $(date +%s) - started )) s |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.name }}
          path: github-io/test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-24.04
    needs: [build, browser]
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontier-${{ github.sha }}
          path: dist/
      - uses: actions/configure-pages@v6.0.0
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
