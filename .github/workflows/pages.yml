name: Test and deploy Frontier Command

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: github-io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-io/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: frontier-${{ github.sha }}
          path: github-io/dist/
          retention-days: 1
      # The Pages package is uploaded here, not in deploy: uploading it in the deploy job and deploying a
      # second later failed twice ("No artifacts named github-pages", 2026-11-25) before the listing caught up.
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: github-io/dist/

  # Unit tests and the Defence bot run beside the build instead of before it (2026-11-25, test speed):
  # the browser jobs need only the built game, so they start about 6 minutes sooner. Deploy still
  # needs this job green.
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: github-io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-io/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:defence

  browser:
    name: Browser checks (${{ matrix.name }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # A public repository may run 20 jobs at once. The longest groups come first in the list below so
      # they start first; the run lasts about as long as the longest group.
      max-parallel: 20
      matrix:
        include:
          # Order (2026-11-25, test speed): the longest groups first, so they start first. Times are the
          # runner's on 2026-11-24 (run 45425626476). A group over ~9 minutes is split, never trimmed:
          # `shard: i/n` runs every n-th unit of work of one suite (tests/lib/shard.mjs), and the n
          # entries together run all of it (tests/ci-matrix.test.js checks that every shard is present).
          # Split from "interface" (Wave 1 integration): render-budget is its own group; the pair ran ~94 s locally, ~22 min estimated on the runner.
          # 2026-11-25: 27 minutes on the runner (45 scenarios at ~36 s), 3 minutes from the job cap: three shards.
          - name: interface-budget
            scripts: render-budget
            shard: 1/3
          - name: interface-budget-2
            scripts: render-budget
            shard: 2/3
          - name: interface-budget-3
            scripts: render-budget
            shard: 3/3
          - name: chronicles
            scripts: chronicles
          - name: visuals
            scripts: visual-combat
          # Split from "story": the four suites together ran 27 to 30 minutes on the runner (the cap).
          # 2026-11-25: audio and choices (13 min together) in their own groups.
          - name: story-choices
            scripts: choices
          - name: status-layout
            scripts: status-layout
          # 2026-11-25: 13 minutes on the runner: two shards (desktop settings + story at 1280x800 and
          # 844x390 / phone settings + story at 390x844 + Korean).
          - name: languages
            scripts: language
            shard: 1/2
          - name: languages-2
            scripts: language
            shard: 2/2
          - name: ui-extras
            scripts: ui-extras abilities
          # 2026-11-25 (W5): the Field Guide's 3D unit view on five viewports (~30 s locally).
          - name: unit-viewer
            scripts: unit-viewer
          - name: construction
            scripts: mobile-construction patrol repair-rally
          - name: defence
            scripts: defence
          # 2026-11-25: split from "defence" (12 minutes together).
          - name: defence-zones
            scripts: defence-zones
          - name: commands
            scripts: auto-combat harvesters hotkeys pc-controls selection
          # Split from "visuals" (Wave 2 integration): all six suites ran ~82 s locally, ~19 min estimated on the runner (limit 20).
          # 2026-11-25: feel, model-loading and portraits (2 minutes) moved here from "visuals".
          - name: visuals-world
            scripts: factions terrain feel model-loading portraits
          - name: story
            scripts: missions
          # 2026-11-25: split from "story" (13.5 minutes together).
          - name: story-tactics
            scripts: tactics-ui
          - name: settings
            scripts: improvements campaign offline
          # 2026-11-25: split from "settings" (12.5 minutes together).
          - name: settings-sheet
            scripts: settings-sheet
          - name: maps
            scripts: stages corners new-game boundary-fx
          - name: mobile
            scripts: mobile mobile-controls mobile-gestures fullscreen
          # 2026-11-25 (W13): the phone HUD (coverage, Hand, minimap side, two-finger twist) and the iPhone gesture
          # rules, which now run in both hands (moved here from "mobile").
          - name: phone-hud
            scripts: phone-hud iphone-gestures
          - name: scenes
            scripts: story
          - name: layout-desktop
            scripts: layout-f
            layoutOnly: desktop,hd,laptop,tablet
          - name: layout-mobile
            scripts: layout-f
            layoutOnly: portrait,landscape,landscape-vi,portrait-vi
          # AAA round 2 (W1-F): the Defence command deck (fast-forward through the frame loop, tower aim, chips, card).
          - name: r2-w1f
            scripts: defence-deck
          # AAA round 3 (R3-Q): first-minute hooks (one-tap Quick battle, First watch roster and Scout Runner), and the bot check (wins, first combat by 45 / 60 s).
          - name: r3-q
            scripts: quick-battle quick-battle-check
          - name: progression
            scripts: progression
          - name: story-audio
            scripts: audio
          # W3 story voices: per-mission story packs after Start, lines in order, scene lines and skip, Voices off;
          # subtitles for unit replies and the announcer (EN/VI/KO, phone and desktop, placement, Subtitles off).
          - name: story-voices
            scripts: story-voices captions
          - name: air
            scripts: air
          # AAA round 3 (R3-M): the title cover (loading screen, key art per frame, live layer, labels, calm mode).
          - name: r3-m
            scripts: cover-ui title
          # AAA round 2 (W2-F): title cards, boss presence, the Keystone Roads node.
          - name: r2-w2f
            scripts: showtime
          - name: desktop
            scripts: browser
          # AAA round 3 (R3-V): the victory ceremony (slow motion, MVP swing, stamp, confetti, count-up), "So close" and a tip, in Skirmish, a mission and Defence.
          - name: r3-v
            scripts: ceremony
          - name: music
            scripts: music
          # Creature round: campaign dens (Acid Hounds in m02, the Wyrm nest in m04) and the Vault Sentinel in m08 at two viewports.
          - name: creatures
            scripts: creatures
          - name: interface
            scripts: ui-quality ambient-life
          # AAA round 3 (R3-E): Defence onboarding (guided first build, badges, discs, narrow landscape dock, next-star hint).
          - name: r3-e
            scripts: defence-onboarding
          # AAA round 2 (W1-D): phones first-class, the battlefield share on a phone.
          - name: r2-w1d
            scripts: phones
          # AAA round 3 (R3-U): audio juice (unit barks rate-limited, quiet mode, weapon-class sounds, impact size layers, stingers).
          - name: r3-u
            scripts: audio-juice
          # AAA round 3 (R3-H): The Sovereign Walks (relay shield, phase 2 surge and rail sweep) at three viewports.
          - name: r3-h
            scripts: sovereign-walks
          # AAA round 3 (R3-B): squad orders (group pace, follow tether, phone group strip); support units on
          # phones (2026-11-24: touch pick prefers own units, type chips, Army = fighters).
          - name: r3-b
            scripts: squad-orders support-touch
          # AAA round 2 (W2-B): Heroic challenges (tab, teaser, badge) and the Heroic bot check, off the build job.
          - name: r2-w2b
            scripts: defence-heroic defence-heroic-check
          # AAA round 3 (R3-K): battle readability (wide-zoom type icons, group badges, threat arrows, death looks, Combined gold trim).
          # Unit review 2026-11-25: every unit of every faction drawn right (model, ground, team colour, bar).
          - name: r3-k
            scripts: readability unit-roster
          - name: bosses
            scripts: boss
          # Split from "ui-extras" (Wave 1 integration): the three suites ran ~119 s locally, ~28 min estimated on the runner.
          - name: ui-extras-messages
            scripts: messages
          # AAA round 3 (R3-G): mission openings, the campaign map (decision marks, ending hints, phone layout), jumpBoss.
          - name: r3-g
            scripts: openings
          # Faction depth (2026-11-24): the either/or doctrine tiles (pick one, the other locks) and the faction signature ability tiles, at three viewports.
          - name: depth
            scripts: faction-depth
          - name: training
            scripts: tutorial
          # AAA round 3 (R3-R): commander rank (fresh profile rank 1, a scripted win ranks up with "Unlocked:", the paint picked in one tap and worn in the next match).
          - name: r3-r
            scripts: rank
          # W6 replay value: achievements toast and Records screen, daily challenge tiles, medal cosmetics, match history and the replay viewer, at three viewports.
          - name: w6
            scripts: meta
          # W11 LAN play: the host server (tools/lan-server.mjs, port 4574, serving dist/) and two browsers, a desktop
          # host and a phone guest: lobby, a 1v1 with orders on both sides and agreeing hashes, the waiting card, pause, forfeit.
          - name: w11
            scripts: lan-play
          # AAA round 4 (R4-P1): the Wild frontier desert test (rule row, one-tap Weather button, aimed Sandstorm, Dune Wyrm Ambush, nest) at three viewports.
          - name: r4-p1
            scripts: wild-desert
          - name: feedback
            scripts: activity
          # AAA round 2 (W0-A): every golden pin with GOLDEN_FULL=1 (300 s points, save and reload,
          # Three Roads, Endless to wave 12), off the 10-minute build job. It needs no browser.
          - name: golden-full
            scripts: golden-full
          # AAA round 3 (R3-D): the night (dark blue, moon and stars) and storm (rain, no flash with motion off) looks.
          - name: r3-d
            scripts: night-storm
          # AAA round 3 (R3-C): the Army size row (200 desktop-only) and the Combined armour step.
          - name: r3-c
            scripts: army-depth
          # AAA round 3 (R3-A): the Field command census (5 factions at 600 s) and the Highlands stall check. No browser.
          - name: r3-a
            scripts: ai-census-check
          # AAA round 2 (W1-A): the Expanded roster setting and the Field workshop.
          - name: r2-w1a
            scripts: workshops
          # AAA round 2 (W1-B): the Gunner team on the phone (tall enough, the pin icon draws).
          - name: r2-w1b
            scripts: gunner
          # AAA round 2 (W2-C): the title screen (wordmark, display font, taps, text sizes).
          - name: r2-w2c
            scripts: title
          - name: r2-w1e
            scripts: sovereign
    defaults:
      run:
        working-directory: github-io
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: github-io/package-lock.json
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          name: frontier-${{ github.sha }}
          path: github-io/dist/
      - name: Install browser for smoke tests
        # The Ubuntu package mirror is sometimes unreachable from the runners for hours. Its packages here
        # are extra fonts; the runner image already carries the libraries Chrome needs. So: give the full
        # install four minutes, then install the browser alone (that download does not use the mirror).
        run: |
          if timeout 240 npx playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::System packages unavailable; installing the browser without them."
          npx playwright install chromium
      - name: Test the built game
        env:
          TEST_SCRIPTS: ${{ matrix.scripts }}
          LAYOUT_ONLY: ${{ matrix.layoutOnly }}
          TEST_SHARD: ${{ matrix.shard }}
          TEST_URL: http://127.0.0.1:4173/
        run: |
          npm run preview -- --port 4173 > /tmp/frontier-preview.log 2>&1 &
          preview_pid=$!
          trap 'kill "$preview_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS "$TEST_URL" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$TEST_URL" > /dev/null
          echo "### Browser suites (${{ matrix.name }})" >> "$GITHUB_STEP_SUMMARY"
          echo "| suite | result | time |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          status=0
          for script in $TEST_SCRIPTS; do
            started=$(date +%s)
            if npm run "test:$script"; then result=pass; else result=FAIL; status=1; fi
            echo "| $script | $result | $(( $(date +%s) - started )) s |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit $status
      - name: Preserve browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: browser-diagnostics-${{ matrix.name }}
          path: github-io/test-results/
          retention-days: 7

  deploy:
    runs-on: ubuntu-24.04
    needs: [build, checks, browser]
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6.0.0
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
