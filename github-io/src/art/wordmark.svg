<svg xmlns="http://www.w3.org/2000/svg" class="wordmark" viewBox="0 0 470 118" role="presentation" focusable="false" overflow="visible">
  <defs>
    <linearGradient id="wm-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff6cf"/>
      <stop offset="0.45" stop-color="#ffc75e"/>
      <stop offset="1" stop-color="#e8862a"/>
    </linearGradient>
    <linearGradient id="wm-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffc75e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ffc75e"/>
      <stop offset="1" stop-color="#ffc75e" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- The words use the page's display font (--font-display, Baloo 2) because the SVG is inlined into the title. -->
  <g font-family="var(--font-display, 'Baloo 2', Arial, sans-serif)" font-weight="800" text-anchor="middle">
    <text x="235" y="68" font-size="74" letter-spacing="3" fill="#2b1603" stroke="#2b1603" stroke-width="12" stroke-linejoin="round" opacity="0.55" transform="translate(0 4)">FRONTIER</text>
    <text x="235" y="68" font-size="74" letter-spacing="3" fill="url(#wm-gold)" stroke="#2b1603" stroke-width="6" stroke-linejoin="round" paint-order="stroke">FRONTIER</text>
    <text x="235" y="108" font-size="33" letter-spacing="15" fill="#f1f6f3" stroke="#04111a" stroke-width="5" stroke-linejoin="round" paint-order="stroke">COMMAND</text>
  </g>
  <rect x="20" y="82" width="86" height="3" rx="1.5" fill="url(#wm-rule)"/>
  <rect x="364" y="82" width="86" height="3" rx="1.5" fill="url(#wm-rule)" transform="rotate(180 407 83.5)"/>
</svg>
