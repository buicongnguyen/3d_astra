<svg xmlns="http://www.w3.org/2000/svg" class="wordmark" viewBox="0 0 470 126" role="presentation" focusable="false" overflow="visible">
  <!-- R3-M title treatment: chrome-gold FRONTIER with a horizon line, holo-teal COMMAND, a teal halo and a
       light sweep (paused by src/app/cover.js under reduced motion or the game's motion setting). -->
  <defs>
    <linearGradient id="wm-metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.3" stop-color="#fff0c2"/>
      <stop offset="0.5" stop-color="#ffc964"/>
      <stop offset="0.52" stop-color="#d9741c"/>
      <stop offset="0.72" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#fff1c8"/>
    </linearGradient>
    <linearGradient id="wm-holo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f2feff"/>
      <stop offset="0.55" stop-color="#8ff0ff"/>
      <stop offset="1" stop-color="#36bfe6"/>
    </linearGradient>
    <linearGradient id="wm-shine" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.44" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="0.56" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; -1 0; 1 0" keyTimes="0; 0.6; 1" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="wm-rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fe8ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#7fe8ff"/>
    </linearGradient>
    <filter id="wm-halo" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>
  <!-- The words use the page's display font (--font-display, Baloo 2) because the SVG is inlined into the title. -->
  <g font-family="var(--font-display, 'Baloo 2', Arial, sans-serif)" font-weight="800" text-anchor="middle">
    <text x="235" y="70" font-size="76" letter-spacing="3" fill="#39c6e8" opacity="0.55" filter="url(#wm-halo)">FRONTIER</text>
    <text x="235" y="70" font-size="76" letter-spacing="3" fill="#061226" stroke="#061226" stroke-width="12" stroke-linejoin="round" opacity="0.7" transform="translate(0 4)">FRONTIER</text>
    <text x="235" y="70" font-size="76" letter-spacing="3" fill="url(#wm-metal)" stroke="#1b0d02" stroke-width="5" stroke-linejoin="round" paint-order="stroke">FRONTIER</text>
    <text x="235" y="70" font-size="76" letter-spacing="3" fill="url(#wm-shine)">FRONTIER</text>
    <text x="235" y="112" font-size="31" letter-spacing="16" fill="url(#wm-holo)" stroke="#04111a" stroke-width="5" stroke-linejoin="round" paint-order="stroke">COMMAND</text>
  </g>
  <rect x="14" y="99" width="92" height="2.5" rx="1.25" fill="url(#wm-rule)"/>
  <rect x="364" y="99" width="92" height="2.5" rx="1.25" fill="url(#wm-rule)" transform="rotate(180 410 100.25)"/>
  <path d="M106 100.25 l5 -4 l5 4 l-5 4 z M364 100.25 l-5 -4 l-5 4 l5 4 z" fill="#ffc964"/>
</svg>
